# cargo audit reads this from the repository root, for both lockfiles CI checks
# (Cargo.lock and ag/Cargo.lock). Vulnerabilities still fail CI; these are
# informational warnings (unmaintained or unsound) about transitive
# dependencies with no fixed release to move to, silenced on 2026-11-02 so the
# audit reports only what needs action. Revisit when the crates are replaced.
[advisories]
ignore = [
    "RUSTSEC-2024-0436", # paste: unmaintained
    "RUSTSEC-2024-0449", # unsafe-libyaml: unmaintained (via serde_yaml)
    "RUSTSEC-2026-0002", # lru: unsound
    "RUSTSEC-2026-0190", # anyhow: unsound Error::downcast_mut()
    "RUSTSEC-2026-0253", # lru: unsound
    "RUSTSEC-2026-0386", # tokio: unsound
]
