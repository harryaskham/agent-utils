name: Deploy GitHub Pages

# Shared self-hosted gh-pages publisher (harryaskham.github.io publish-pages.yml):
# deploys docs/ to a.skh.am/agent-utils/ whenever render inputs change on main.
# Previously tag-only (bd-e9884a); tags were rejected by the github-pages
# environment (main only) and the azure-ephemeral pool is retired, so the site
# had not deployed since June.
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - scripts/render-pages.mjs
      - package.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: write # push gh-pages
  pages: write    # request the Pages build

jobs:
  pages:
    uses: harryaskham/harryaskham.github.io/.github/workflows/publish-pages.yml@main
    with:
      path: docs
      build: nix develop --command node scripts/render-pages.mjs --check
