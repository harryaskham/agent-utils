<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file: data:; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<title>ag · Fleet canvases</title>
<style>
[hidden]{display:none!important}:root{color-scheme:dark;--bg:#131719;--surface:#1c2225;--sunk:#0f1214;--text:#edf1ee;--muted:#a5b3ae;--line:#34423e;--accent:#b9e584;--warn:#efc384;--veil:#0a0d0ef5}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,sans-serif}body.light{color-scheme:light;--bg:#f4f5ef;--surface:#fff;--sunk:#e8ede6;--text:#1c2b24;--muted:#52665a;--line:#c5d0c6;--accent:#315e20;--warn:#855600;--veil:#f4f5eff7}
button,input,select{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px 10px}button{cursor:pointer}button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible,.tile:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{opacity:.5;cursor:default}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
header{position:sticky;top:0;z-index:1;background:var(--bg);border-bottom:1px solid var(--line);padding:18px 24px 14px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}h1{font-size:20px;letter-spacing:-.6px;margin:0;white-space:nowrap}h1 b{color:var(--accent);font:600 24px ui-monospace,monospace;margin-right:9px}#count{color:var(--muted);font:13px ui-monospace,monospace;margin-left:auto}
.filters{display:flex;gap:8px;width:100%}input{flex:1;min-width:80px}select{max-width:210px}.toggle{display:flex;align-items:center;gap:6px;white-space:nowrap;color:var(--muted);font-size:14px}.toggle input{flex:none;min-width:0;accent-color:var(--accent)}
main{padding:18px 24px 30px}details{margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:12px;color:var(--muted)}summary{cursor:pointer;color:var(--text)}summary.warning{color:var(--warn)}.hosts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px;margin-top:12px}.host{border-left:2px solid var(--accent);padding:5px 10px;overflow-wrap:anywhere}.host.stale{border-color:var(--warn)}.host strong{display:block;color:var(--text)}.host small{display:block}.warning{color:var(--warn)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px 18px}
.tile{display:flex;flex-direction:column;text-align:left;background:transparent;border:0;padding:0 0 0 10px;min-width:0;border-radius:0;border-left:3px solid transparent}.tile:hover{border-color:var(--line)}.tile.fresh{border-color:var(--accent)}.tile.stale{border-color:var(--warn)}
.picture{height:210px;width:100%;display:grid;place-items:center;background:var(--sunk);overflow:hidden;border:1px solid var(--line);border-radius:3px}.picture img{width:100%;height:100%;object-fit:contain}.picture .missing{padding:18px;color:var(--warn);text-align:center;font-size:13px}
.name{display:flex;gap:8px;align-items:baseline;padding-top:9px;max-width:100%;font:13px ui-monospace,monospace}.node{color:var(--accent);white-space:nowrap}.id{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.telemetry{color:var(--muted);font:12px ui-monospace,monospace;margin-top:3px;font-variant-numeric:tabular-nums}.telemetry .flag{color:var(--accent)}.telemetry .stale{color:var(--warn)}
.snippet{color:var(--muted);font-size:13px;margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
#empty{padding:60px 0;text-align:center;color:var(--muted)}
dialog{border:0;padding:0;max-width:none;max-height:none;width:100vw;height:100dvh;background:var(--veil);color:var(--text)}dialog::backdrop{background:var(--veil)}.viewer{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.bar{display:flex;align-items:center;gap:8px;padding:12px 20px;border-bottom:1px solid var(--line)}#identity{margin-right:auto;min-width:0;overflow-wrap:anywhere;font:600 14px ui-monospace,monospace}#identity .node{margin-right:8px}#zoomlevel{font:13px ui-monospace,monospace;color:var(--muted);min-width:4.5em;text-align:right}
#stage{position:relative;overflow:hidden;cursor:grab;touch-action:none;background:var(--sunk)}#stage.dragging{cursor:grabbing}#full{position:absolute;left:0;top:0;max-width:none;user-select:none;-webkit-user-drag:none}#full-missing{position:absolute;inset:0;display:grid;place-items:center;color:var(--warn)}
.meta{padding:10px 20px;border-top:1px solid var(--line);color:var(--muted);font:12px/1.6 ui-monospace,monospace;overflow-wrap:anywhere;max-height:26vh;overflow:auto;display:grid;grid-template-columns:max-content 1fr;gap:0 14px}.meta dt{color:var(--text)}.meta dd{margin:0}.meta code{user-select:all;color:var(--accent)}.meta .warning{color:var(--warn)}
#keyhint{color:var(--muted);font-size:12px;margin-left:6px}
@media(max-width:650px){header{padding:12px;gap:8px}main{padding:12px}.filters{flex-wrap:wrap}input{flex-basis:100%}select{flex:1;max-width:48%;min-width:0}#grid{grid-template-columns:minmax(0,1fr);gap:16px}.picture{height:190px}.bar{padding:8px;flex-wrap:wrap}#identity{flex-basis:100%;font-size:13px}#keyhint{display:none}.meta{padding:8px}#count{font-size:11px}}
</style></head><body>
<header><h1><b>ag</b>Fleet canvases</h1><span id="count" role="status"></span><button id="theme" aria-label="Switch color theme">Light</button>
<div class="filters"><input id="search" type="search" placeholder="Search boards, nodes and their text" aria-label="Search canvases"><select id="host" aria-label="Filter node"><option value="">All nodes</option></select><select id="sort" aria-label="Sort"><option value="recent">Recent</option><option value="node">Node</option><option value="name">Name</option></select><label class="toggle"><input type="checkbox" id="fresh"> Changed in last pull</label></div></header>
<main><details id="nodes"><summary id="health"></summary><div id="hosts" class="hosts"></div></details><div id="grid"></div><div id="empty" hidden></div></main>
<dialog id="preview" aria-label="Canvas viewer"><div class="viewer"><div class="bar"><span id="identity"></span><button id="back" aria-label="Previous canvas">←</button><button id="forward" aria-label="Next canvas">→</button><button id="minus" aria-label="Zoom out">−</button><span id="zoomlevel"></span><button id="plus" aria-label="Zoom in">+</button><button id="fit">Fit</button><button id="actual">1:1</button><button id="close" aria-label="Close viewer">Close ✕</button><span id="keyhint">← → · + − 0 1 · drag · Esc</span></div>
<div id="stage"><img id="full" alt="" draggable="false"><div id="full-missing" hidden>No render cached for this canvas yet.</div></div><dl id="metadata" class="meta"></dl></div></dialog>
<script type="application/json" id="manifest">__MANIFEST__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('manifest').textContent),$=id=>document.getElementById(id);
const el=(tag,props={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(props)){if(k==='text')e.textContent=v;else if(k==='class')e.className=v;else e.setAttribute(k,v)}e.append(...kids);return e};
const size=n=>n>=1048576?(n/1048576).toFixed(1)+' MiB':Math.max(1,Math.ceil(n/1024))+' KiB';
const ago=ms=>{if(!ms)return'never';const s=Math.max(0,(Date.now()-ms)/1000);if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago'};
const fresh=c=>c.rendered_ms&&c.rendered_ms>=data.pulled_ms;
const stale=c=>!!c.error||(c.rendered_revision!=null&&c.rendered_revision<c.revision);
let shown=[],current=0,returnFocus=null,view={scale:1,x:0,y:0,fit:true};
for(const h of[...new Set(data.hosts.map(h=>h.host))].sort())$('host').append(el('option',{value:h,text:h}));
{const bad=data.hosts.filter(h=>h.state==='unavailable'||h.warnings.length),count=s=>data.hosts.filter(h=>h.state===s).length;const changed=data.canvases.filter(fresh).length;
$('health').textContent=[`${data.hosts.length} nodes`,count('synced')&&`${count('synced')} listed`,count('cached')&&`${count('cached')} cached`,`${changed} changed in last pull`,bad.length&&`${bad.length} need attention`].filter(Boolean).join(' · ');if(bad.length)$('health').classList.add('warning');
const key='ag.canvas.nodes.open';try{$('nodes').open=localStorage.getItem(key)==='1'}catch{}$('nodes').addEventListener('toggle',()=>{try{localStorage.setItem(key,$('nodes').open?'1':'0')}catch{}});
for(const h of data.hosts){const row=el('div',{class:'host'+(h.state!=='unavailable'&&!h.warnings.length?'':' stale')},el('strong',{text:h.host}),el('small',{text:`${h.canvases} canvases · ${h.state}${h.rendered?' · '+h.rendered+' rendered':''}`}),el('small',{text:h.last_sync_ms?'Listed '+new Date(h.last_sync_ms).toLocaleString():'Not pulled yet'}));for(const w of h.warnings)row.append(el('small',{class:'warning',text:w}));$('hosts').append(row)}}
function filter(){const q=$('search').value.toLocaleLowerCase(),host=$('host').value,onlyFresh=$('fresh').checked;
shown=data.canvases.filter(c=>(!host||c.host===host)&&(!onlyFresh||fresh(c))&&(!q||[c.id,c.host,c.text,c.ocr||''].some(v=>v.toLocaleLowerCase().includes(q))));
const sort=$('sort').value;if(sort==='node')shown.sort((a,b)=>a.host.localeCompare(b.host)||b.updated_ms-a.updated_ms);else if(sort==='name')shown.sort((a,b)=>a.id.localeCompare(b.id)||a.host.localeCompare(b.host));else shown.sort((a,b)=>b.updated_ms-a.updated_ms||a.host.localeCompare(b.host));render()}
function render(){const grid=$('grid');grid.replaceChildren();shown.forEach((c,i)=>{const picture=el('span',{class:'picture'});
if(c.src){const img=el('img',{loading:'lazy',decoding:'async',alt:`${c.id} on ${c.host}`,src:c.src});img.onerror=()=>picture.replaceChildren(el('span',{class:'missing',text:'Render unavailable in this browser'}));picture.append(img)}else picture.append(el('span',{class:'missing',text:c.error||'Not rendered yet'}));
const t=el('span',{class:'telemetry'},`r${c.revision} · ${c.objects} obj · ${ago(c.updated_ms)}`);if(fresh(c))t.append(' · ',el('span',{class:'flag',text:'changed'}));if(stale(c))t.append(' · ',el('span',{class:'stale',text:c.rendered_revision!=null?'showing r'+c.rendered_revision:'stale'}));if(c.format==='png')t.append(' · png');
const tile=el('button',{class:'tile'+(fresh(c)?' fresh':'')+(stale(c)?' stale':''),'aria-label':`${c.id} on ${c.host}, revision ${c.revision}`},picture,el('span',{class:'name'},el('span',{class:'node',text:c.host}),el('span',{class:'id',text:c.id})),t);
const snippet=c.ocr||c.text;if(snippet)tile.append(el('span',{class:'snippet',text:snippet}));tile.onclick=()=>open(i,tile);grid.append(tile)});
$('count').textContent=`${shown.length.toLocaleString()} / ${data.canvases.length.toLocaleString()} canvases`;
const empty=$('empty');empty.hidden=shown.length>0;empty.textContent=data.canvases.length?'No matching canvases':(data.hosts.length?'No canvases on the selected nodes yet':'Nothing pulled yet')}
function apply(){const img=$('full');img.style.width=Math.round(img.naturalWidth*view.scale)+'px';img.style.height=Math.round(img.naturalHeight*view.scale)+'px';img.style.transform=`translate(${Math.round(view.x)}px,${Math.round(view.y)}px)`;$('zoomlevel').textContent=Math.round(view.scale*100)+'%'}
function fit(){const img=$('full'),s=$('stage');if(!img.naturalWidth)return;view.scale=Math.min(s.clientWidth/img.naturalWidth,s.clientHeight/img.naturalHeight,4);view.x=(s.clientWidth-img.naturalWidth*view.scale)/2;view.y=(s.clientHeight-img.naturalHeight*view.scale)/2;view.fit=true;apply()}
function zoom(factor,cx,cy){const s=$('stage'),r=s.getBoundingClientRect();cx??=r.width/2;cy??=r.height/2;const next=Math.max(.05,Math.min(16,view.scale*factor)),k=next/view.scale;view.x=cx-(cx-view.x)*k;view.y=cy-(cy-view.y)*k;view.scale=next;view.fit=false;apply()}
function actual(){const s=$('stage'),r=s.getBoundingClientRect();zoom(1/view.scale,r.width/2,r.height/2)}
function open(i,source){current=i;if(source)returnFocus=source;const c=shown[current];if(!c)return;
$('identity').replaceChildren(el('span',{class:'node',text:c.host}),c.id);const img=$('full');img.hidden=!c.src;$('full-missing').hidden=!!c.src;img.onload=fit;img.onerror=()=>{img.hidden=true;$('full-missing').hidden=false};if(c.src)img.src=c.src;
const rows=[['revision',`r${c.revision}`+(c.rendered_revision!=null&&c.rendered_revision!==c.revision?` · showing r${c.rendered_revision}`:'')],['updated',c.updated_ms?new Date(c.updated_ms).toLocaleString()+` (${ago(c.updated_ms)})`:'—'],['objects',String(c.objects)],['render',c.format?`${c.format} · ${size(c.bytes)} · ${c.rendered_ms?ago(c.rendered_ms):''}`:'none']];
const meta=$('metadata');meta.replaceChildren();for(const[k,v]of rows)meta.append(el('dt',{text:k}),el('dd',{text:v}));meta.append(el('dt',{text:'open'}),el('dd',{},el('code',{text:c.open})));if(c.ocr)meta.append(el('dt',{text:'ocr'}),el('dd',{text:c.ocr}));if(c.error)meta.append(el('dt',{text:'error'}),el('dd',{class:'warning',text:c.error}));
$('back').disabled=current===0;$('forward').disabled=current>=shown.length-1;if(!$('preview').open)$('preview').showModal();if(img.complete&&img.naturalWidth)fit()}
let drag=null;const stage=$('stage');
stage.addEventListener('wheel',e=>{e.preventDefault();const r=stage.getBoundingClientRect();zoom(Math.exp(-e.deltaY*(e.deltaMode?0.05:0.0015)),e.clientX-r.left,e.clientY-r.top)},{passive:false});
stage.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,ox:view.x,oy:view.y};stage.setPointerCapture(e.pointerId);stage.classList.add('dragging')};
stage.onpointermove=e=>{if(!drag)return;view.x=drag.ox+e.clientX-drag.x;view.y=drag.oy+e.clientY-drag.y;view.fit=false;apply()};
stage.onpointerup=stage.onpointercancel=()=>{drag=null;stage.classList.remove('dragging')};
stage.ondblclick=e=>{const r=stage.getBoundingClientRect();view.fit?zoom(2,e.clientX-r.left,e.clientY-r.top):fit()};
window.addEventListener('resize',()=>{if($('preview').open&&view.fit)fit()});
$('plus').onclick=()=>zoom(1.4);$('minus').onclick=()=>zoom(1/1.4);$('fit').onclick=fit;$('actual').onclick=actual;$('close').onclick=()=>$('preview').close();$('preview').onclose=()=>returnFocus?.focus();$('back').onclick=()=>open(current-1);$('forward').onclick=()=>open(current+1);
document.addEventListener('keydown',e=>{if(!$('preview').open)return;if(e.key==='ArrowLeft'&&current>0)open(current-1);else if(e.key==='ArrowRight'&&current<shown.length-1)open(current+1);else if(e.key==='+'||e.key==='=')zoom(1.4);else if(e.key==='-')zoom(1/1.4);else if(e.key==='0')fit();else if(e.key==='1')actual();else return;e.preventDefault()});
// Filters survive the dashboard re-framing a newer pull (this tab only).
const filtersKey='ag.canvas.filters';const save=()=>{try{sessionStorage.setItem(filtersKey,JSON.stringify({search:$('search').value,host:$('host').value,sort:$('sort').value,fresh:$('fresh').checked}))}catch{}};
try{const f=JSON.parse(sessionStorage.getItem(filtersKey)||'{}');if(typeof f.search==='string')$('search').value=f.search;for(const id of['host','sort'])if(typeof f[id]==='string'&&[...$(id).options].some(o=>o.value===f[id]))$(id).value=f[id];$('fresh').checked=!!f.fresh}catch{}
for(const id of['search'])$(id).oninput=()=>{save();filter()};for(const id of['host','sort','fresh'])$(id).onchange=()=>{save();filter()};
$('theme').onclick=()=>{document.body.classList.toggle('light');$('theme').textContent=document.body.classList.contains('light')?'Dark':'Light'};
filter();
</script></body></html>
