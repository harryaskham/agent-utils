<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file: data:; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<title>ag · Fleet images</title>
<style>
:root{color-scheme:dark;--bg:#131719;--surface:#1c2225;--text:#edf1ee;--muted:#a5b3ae;--line:#34423e;--accent:#b9e584;--warn:#efc384;--veil:#0a0d0ef5;--checker:#252f2b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,sans-serif}body.light{color-scheme:light;--bg:#f4f5ef;--surface:#fff;--text:#1c2b24;--muted:#52665a;--line:#c5d0c6;--accent:#315e20;--warn:#855600;--veil:#f4f5eff7;--checker:#e8ede6}button,input,select{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px 10px}button{cursor:pointer}button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{opacity:.5;cursor:default}header{position:sticky;top:0;z-index:1;background:var(--bg);border-bottom:1px solid var(--line);padding:18px 24px 14px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}h1{font-size:20px;letter-spacing:-.6px;margin:0;white-space:nowrap}h1 b{color:var(--accent);font:600 24px ui-monospace,monospace;margin-right:9px}#count{color:var(--muted);font:13px ui-monospace,monospace;margin-left:auto}.filters{display:flex;gap:8px;width:100%}input{flex:1;min-width:80px}select{max-width:210px}main{padding:18px 24px 30px}details{margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:12px;color:var(--muted)}summary{cursor:pointer;color:var(--text)}.hosts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px;margin-top:12px}.host{border-left:2px solid var(--accent);padding:5px 10px;overflow-wrap:anywhere}.host.stale{border-color:var(--warn)}.host strong{display:block;color:var(--text)}.host small{display:block}.warning{color:var(--warn)}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}.tile{display:flex;flex-direction:column;background:transparent;text-align:left;border:0;padding:0;min-width:0;border-radius:0}.picture{height:200px;width:100%;display:grid;place-items:center;background:linear-gradient(45deg,var(--checker) 25%,transparent 25%,transparent 75%,var(--checker) 75%),linear-gradient(45deg,var(--checker) 25%,var(--surface) 25%,var(--surface) 75%,var(--checker) 75%);background-size:18px 18px;background-position:0 0,9px 9px;overflow:hidden;border:1px solid var(--line);border-radius:3px}.picture img{width:100%;height:100%;object-fit:contain}.picture .error{padding:18px;color:var(--warn);text-align:center}.provenance{display:flex;gap:7px;align-items:baseline;padding-top:8px;max-width:100%;font:12px ui-monospace,monospace}.node{color:var(--accent)}.agent{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.caption{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%;margin-top:3px}.time{color:var(--muted);font-size:12px;margin-top:3px}#empty{padding:60px 0;text-align:center;color:var(--muted)}#paging{display:flex;gap:15px;align-items:center;justify-content:center;margin:30px 0}#page{font:13px ui-monospace,monospace;color:var(--muted)}dialog{border:0;padding:0;max-width:none;max-height:none;width:100vw;height:100dvh;background:var(--veil);color:var(--text)}dialog::backdrop{background:var(--veil)}.viewer{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}.bar{display:flex;align-items:center;gap:8px;padding:12px 20px;border-bottom:1px solid var(--line)}#identity{margin-right:auto;min-width:0;overflow-wrap:anywhere}#position{font:13px ui-monospace,monospace;color:var(--muted);white-space:nowrap}#stage{overflow:auto;display:flex;align-items:safe center;justify-content:safe center;padding:14px;cursor:grab}#stage:active{cursor:grabbing}#full{max-width:100%;max-height:100%;object-fit:contain;flex-shrink:0}#full.zoomed{max-width:none;max-height:none}#image-error{color:var(--warn)}.meta{padding:10px 20px;border-top:1px solid var(--line);color:var(--muted);font:12px/1.5 ui-monospace,monospace;overflow-wrap:anywhere;max-height:24vh;overflow:auto}.meta div{margin:2px 0}#keyhint{margin-left:auto;color:var(--muted);font-size:12px}@media(max-width:650px){header{padding:12px;gap:8px}main{padding:12px}.filters{flex-wrap:wrap}input{flex-basis:100%}select{flex:1;max-width:48%;min-width:0}#grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.picture{height:155px}.provenance{flex-wrap:wrap;gap:1px 6px}.bar{padding:8px;flex-wrap:wrap}#identity{flex-basis:70%;font-size:13px}#keyhint{display:none}.meta{padding:8px}#count{font-size:11px}.caption{font-size:13px}}
</style></head><body>
<header><h1><b>ag</b>Fleet images</h1><span id="count" role="status"></span><button id="theme" aria-label="Switch color theme">Light</button><div class="filters"><input id="search" type="search" placeholder="Search agent, label or image ID" aria-label="Search images"><select id="host" aria-label="Filter node"><option value="">All nodes</option></select><select id="agent" aria-label="Filter agent"><option value="">All agents</option></select></div></header>
<main><details id="nodes"><summary id="health"></summary><div id="hosts" class="hosts"></div></details><div id="grid"></div><div id="empty" hidden>No matching images</div><nav id="paging" aria-label="Gallery pages"><button id="previous">← Previous</button><span id="page"></span><button id="next">Next →</button></nav></main>
<dialog id="preview" aria-label="Full-size image preview"><div class="viewer"><div class="bar"><strong id="identity"></strong><span id="position"></span><button id="close" aria-label="Close preview">Close ✕</button><button id="back" aria-label="Previous image">←</button><button id="forward" aria-label="Next image">→</button><button id="minus" aria-label="Zoom out">−</button><button id="plus" aria-label="Zoom in">+</button><button id="fit">Fit</button><span id="keyhint">← → browse · + − zoom · Esc close</span></div><div id="stage"><img id="full" alt=""><div id="image-error" hidden>Preview unavailable in this browser. The original image is cached locally.</div></div><div id="metadata" class="meta"></div></div></dialog>
<script type="application/json" id="manifest">__MANIFEST__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('manifest').textContent), $=id=>document.getElementById(id);
const text=(tag,value,className)=>{const el=document.createElement(tag);el.textContent=value;if(className)el.className=className;return el};
const size=n=>n>=1048576?(n/1048576).toFixed(1)+' MiB':Math.ceil(n/1024)+' KiB';
let filtered=[],page=0,current=0,zoom=null,returnFocus=null;const perPage=120;
function options(id,values){for(const value of [...new Set(values)].sort()){const option=text('option',value);option.value=value;$(id).append(option)}}
options('host',data.hosts.map(h=>h.host));options('agent',data.images.map(i=>i.agent));
const stale=data.hosts.filter(h=>h.state!=='synced'||h.invalid);
$('health').textContent=`${data.hosts.length} nodes · ${data.hosts.filter(h=>h.state==='synced').length} synced · ${stale.length} cached or needs attention`;
$('nodes').open=stale.length>0;
for(const host of data.hosts){const row=text('div','','host'+(host.state==='synced'&&!host.invalid?'':' stale'));row.append(text('strong',host.host),text('small',`${host.images} images · ${host.state}${host.invalid?' · '+host.invalid+' invalid':''}`),text('small',host.last_sync_ms?'Last sync '+new Date(host.last_sync_ms).toLocaleString():'Not synced yet'));for(const warning of host.warnings)row.append(text('small',warning,'warning'));$('hosts').append(row)}
function filter(){const query=$('search').value.toLocaleLowerCase();filtered=data.images.filter(i=>(!$('host').value||i.host===$('host').value)&&(!$('agent').value||i.agent===$('agent').value)&&(!query||[i.agent,i.host,i.id,i.label].some(v=>v.toLocaleLowerCase().includes(query))));page=0;render()}
function render(){const grid=$('grid');grid.replaceChildren();const begin=page*perPage;filtered.slice(begin,begin+perPage).forEach((image,index)=>{const tile=text('button','','tile');tile.setAttribute('aria-label',`${image.host} · ${image.agent} · ${image.label||image.id}`);const picture=text('span','','picture'),img=document.createElement('img');img.loading='lazy';img.decoding='async';img.alt=image.label||image.id;img.src=image.src;img.onerror=()=>{picture.replaceChildren(text('span','Preview unavailable · '+image.mime_type,'error'))};picture.append(img);const provenance=text('span','','provenance');provenance.append(text('span',image.host,'node'),text('span',image.agent,'agent'));tile.append(picture,provenance,text('span',image.label||image.id.split('/').pop(),'caption'),text('span',`${image.timestamp} · ${size(image.bytes)}`,'time'));tile.onclick=()=>open(begin+index,tile);grid.append(tile)});$('count').textContent=`${filtered.length.toLocaleString()} / ${data.images.length.toLocaleString()} images`;$('empty').hidden=filtered.length>0;$('previous').disabled=page===0;$('next').disabled=(page+1)*perPage>=filtered.length;$('page').textContent=filtered.length?`${begin+1}–${Math.min(begin+perPage,filtered.length)} of ${filtered.length.toLocaleString()}`:'0 images'}
function open(index,source){current=index;zoom=null;if(source)returnFocus=source;const image=filtered[current];if(!image)return;$('identity').textContent=`${image.host} / ${image.agent}`;$('position').textContent=`${current+1} / ${filtered.length}`;$('full').hidden=false;$('image-error').hidden=true;$('full').alt=image.label||image.id;$('full').classList.remove('zoomed');$('full').style.width='';$('full').style.height='';$('full').src=image.src;$('full').onerror=()=>{$('full').hidden=true;$('image-error').hidden=false};$('metadata').replaceChildren(...[image.label,image.id,`${image.timestamp} · ${image.mime_type} · ${size(image.bytes)}`,`SHA-256 ${image.sha256}`].filter(Boolean).map(value=>text('div',value)));$('back').disabled=current===0;$('forward').disabled=current===filtered.length-1;if(!$('preview').open)$('preview').showModal();$('stage').scrollTop=0;$('stage').scrollLeft=0}
function scale(factor){const img=$('full');if(!img.naturalWidth)return;zoom=Math.max(.1,Math.min(8,(zoom??Math.min(img.clientWidth/img.naturalWidth,img.clientHeight/img.naturalHeight))*factor));img.classList.add('zoomed');img.style.width=Math.round(img.naturalWidth*zoom)+'px';img.style.height=Math.round(img.naturalHeight*zoom)+'px'}
$('search').oninput=filter;$('host').onchange=filter;$('agent').onchange=filter;
$('previous').onclick=()=>{page--;render();window.scrollTo(0,0)};$('next').onclick=()=>{page++;render();window.scrollTo(0,0)};
$('close').onclick=()=>$('preview').close();$('preview').onclose=()=>returnFocus?.focus();$('back').onclick=()=>open(current-1);$('forward').onclick=()=>open(current+1);$('plus').onclick=()=>scale(1.4);$('minus').onclick=()=>scale(1/1.4);$('fit').onclick=()=>open(current);
document.addEventListener('keydown',event=>{if(!$('preview').open)return;if(event.key==='ArrowLeft'&&current>0)open(current-1);else if(event.key==='ArrowRight'&&current+1<filtered.length)open(current+1);else if(event.key==='+'||event.key==='=')scale(1.4);else if(event.key==='-')scale(1/1.4);else return;event.preventDefault()});
let drag=null;$('stage').onpointerdown=event=>{if(event.target!==$('full'))return;event.preventDefault();drag={x:event.clientX,y:event.clientY,left:$('stage').scrollLeft,top:$('stage').scrollTop};$('stage').setPointerCapture(event.pointerId)};$('stage').onpointermove=event=>{if(drag){$('stage').scrollLeft=drag.left+drag.x-event.clientX;$('stage').scrollTop=drag.top+drag.y-event.clientY}};$('stage').onpointerup=$('stage').onpointercancel=()=>drag=null;
$('theme').onclick=()=>{document.body.classList.toggle('light');$('theme').textContent=document.body.classList.contains('light')?'Dark':'Light'};
filter();
</script></body></html>
