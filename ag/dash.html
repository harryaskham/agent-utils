<style>

</style></head><body>
<header>
  <span class="brand">ag</span>
  <nav role="tablist" aria-label="Views">

</header>
<section id="choices" role="tabpanel" aria-labelledby="tab-choices">

  <main id="detail"></main>
</section>
<section id="health" role="tabpanel" aria-labelledby="tab-health" hidden></section>

<script>

const $=id=>document.getElementById(id);

function flat(){

function render(){

function renderRail(items){

    if(n.error)rail.append(el('div',{class:'node-error',text:n.error}));
    for(const a of n.agents){
      rail.append(el('div',{class:'agent',title:a.title},a.title,el('small',{text:a.provider})));
      for(const c of a.choices){
        const k=keyOf(c);
        rail.append(el('button',{class:'item'+(c.actionable?'':' stale'),'aria-current':String(k===selected),title:c.title,onclick:()=>{selected=k;armed=null;renderRail(items);renderDetail(items)}},el('span',{class:'mark',text:c.actionable?'◆':'◇'}),el('span',{class:'t',text:c.title})));

function renderDetail(items,force){

    }

  const actions=el('div',{class:'actions'});
  if(!instant)actions.append(el('button',{class:'primary',disabled:!c.actionable||sending,text:c.questions.length?'Submit':'Accept',onclick:()=>submit(item,'accept')}));
  const decline=el('button',{class:'danger'+(armed===selected?' armed':''),disabled:!c.actionable||sending,text:armed===selected?'Confirm decline':'Decline',onclick:()=>{if(armed===selected){armed=null;submit(item,'decline')}else{armed=selected;renderDetail(items,true)}}});

function showReceipt(text,kind){const r=$('receipt');if(r){r.textContent=text;r.className='receipt '+kind}}
async function submit(item,response){

function renderHealth(){

let framed=null;
function renderImagesStatus(){

function renderImages(){

  const want=i.available?'/gallery/index.html?v='+(i.finished_ms||0):null;
  if(want===framed)return;framed=want;
  $('imgframe').replaceChildren(want?el('iframe',{src:want,title:'Fleet image gallery'}):el('div',{class:'empty'},el('strong',{text:i.enabled?'No gallery yet':'Image pulls are disabled'}),i.enabled?'The first pull is running in the background.':''));
}
function show(name){tab=name;for(const t of['choices','health','images']){$('tab-'+t).setAttribute('aria-selected',String(t===name));$(t).hidden=t!==name}}
for(const t of['choices','health','images'])$('tab-'+t).onclick=()=>show(t);
$('refresh').onclick=()=>api('/api/refresh',{what:['choices','doctor']}).then(()=>setTimeout(poll,300)).catch(()=>{});
$('pull').onclick=()=>api('/api/refresh',{what:['images']}).then(()=>setTimeout(poll,300)).catch(()=>{});
$('theme').onclick=()=>{document.body.classList.toggle('light');$('theme').textContent=document.body.classList.contains('light')?'Dark':'Light'};
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea')||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='r'){$('refresh').click();return}
  if(tab!=='choices'){if(e.key==='c')show('choices');return}
  const items=flat(),at=items.findIndex(i=>keyOf(i.choice)===selected);
  if(e.key==='j'||e.key==='ArrowDown'){const n=items[Math.min(items.length-1,at+1)];if(n){selected=keyOf(n.choice);armed=null;renderRail(items);renderDetail(items)}e.preventDefault()}
  else if(e.key==='k'||e.key==='ArrowUp'){const n=items[Math.max(0,at-1)];if(n){selected=keyOf(n.choice);armed=null;renderRail(items);renderDetail(items)}e.preventDefault()}
  else if(/^[1-9]$/.test(e.key)){document.querySelector(`#detail .opt[data-k="${e.key}"]`)?.click()}
  else if(e.key==='i'){const input=document.querySelector('#detail input');if(input){input.focus();e.preventDefault()}}
  else if(e.key==='d'){document.querySelector('#detail .danger')?.click()}
});
poll();setInterval(poll,4000);setInterval(live,1000);
</script></body></html>
