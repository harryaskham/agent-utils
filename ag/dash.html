<style>

<header>

  <nav role="tablist" aria-label="Views">

  <span id="live" role="status"></span>

</header>

</section>

  <div id="imgframe"></div>
</section>

</section>

<script>
'use strict';
const $=id=>document.getElementById(id);
const el=(tag,props={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(props)){if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k.startsWith('on'))e[k]=v;else if(v!==undefined&&v!==null&&v!==false)e.setAttribute(k,v===true?'':v)}e.append(...kids.filter(k=>k!==null&&k!==undefined));return e};

const keyOf=c=>c.host+'\u001f'+c.session+'\u001f'+c.request_id;
let data=null,last='',selected=null,shown=null,tab='choices',drafts={},armed=null,sending=false,offline=false,expired=false,pollTimer,liveTimer;

  const r=await fetch(path,body===undefined?{credentials:'same-origin',cache:'no-store'}:{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json','x-ag-dash':'1'},body:JSON.stringify(body)});

async function poll(){
  if(expired)return;
  try{
    const next=await api('/api/state');if(expired)return;offline=false;

function live(){

}
function flat(){
  const out=[];if(!data?.choices)return out;
  for(const n of data.choices.nodes)for(const a of n.agents)for(const c of a.choices)out.push({node:n,agent:a,choice:c});

}
function render(){
  const items=flat();
  const waiting=data?.choices?.actionable??0;
  $('b-choices').textContent=waiting;$('b-choices').className='badge'+(waiting?' hot':'');
  const doc=data?.doctor;
  if(doc){const{error:bad,warn,offline}=doc.counts;$('b-health').textContent=bad||warn||(offline?offline+' off':'ok');$('b-health').className='badge'+(bad?' bad':warn?' hot':'')}

  $('b-audio').textContent=data?.audio?.clips||'·';
  window.agTts?.status(data.tts);
  document.title=(waiting?`(${waiting}) `:'')+'ag · fleet';
  if(!items.some(i=>keyOf(i.choice)===selected))selected=items.find(i=>i.choice.actionable)?.choice?keyOf(items.find(i=>i.choice.actionable).choice):items[0]?keyOf(items[0].choice):null;
  renderRail(items);renderDetail(items);renderHealth();renderImages();renderAudio();live();
}
function renderRail(items){
  const rail=$('rail');rail.replaceChildren();
  const nodes=(data?.choices?.nodes||[]).slice().sort((a,b)=>(b.agents.length>0)-(a.agents.length>0)||(a.state==='error')-(b.state==='error')||(a.node||a.host).localeCompare(b.node||b.host)||(a.source||'').localeCompare(b.source||''));

  let any=false;
  for(const n of nodes){
    if(!n.agents.length&&n.state!=='error')continue;any=true;
    const count=n.agents.reduce((s,a)=>s+a.choices.filter(c=>c.actionable).length,0);
    rail.append(el('div',{class:'node'},label(n),el('span',{class:'n',text:n.state==='error'?'failing':String(count)})));

      rail.append(el('div',{class:'agent',title:a.title},a.title,el('small',{text:a.kind&&a.kind!==a.provider?`${a.provider} · ${a.kind}`:a.provider})));

  if(quiet)rail.append(el('div',{class:'node'},el('span',{class:'n',text:`${quiet} node${quiet===1?'':'s'} with nothing waiting`})));
  if(offline.length)rail.append(el('div',{class:'node',title:offline.join(', ')},el('span',{class:'n',text:`${offline.length} offline · ${offline.join(', ')}`})));
}
function renderDetail(items,force){

  const{agent:a,choice:c}=item;const draft=drafts[selected]??={answers:{},free:{}};

  d.append(el('h2',{text:c.title}));
  if(c.message)d.append(el('p',{class:'msg context',text:c.message}));
  if(c.url)d.append(el('a',{class:'url',href:c.url,target:'_blank',rel:'noopener noreferrer',text:c.url}));
  if(c.stale_reason)d.append(el('div',{class:'stale-note',text:c.stale_reason}));

  c.questions.forEach((q,qi)=>{
    const box=el('div',{class:'q'});
    if(c.questions.length>1)box.append(el('h3',{text:`${qi+1}. ${q.title||q.message}`}));
    if(q.message&&q.message!==c.title&&!(c.questions.length>1&&!q.title))box.append(el('p',{class:'msg',text:q.message}));
    const opts=el('div',{class:'opts'});
    const options=q.kind==='boolean'?[{id:true,label:'Yes'},{id:false,label:'No'}]:q.options;

      const multi=q.kind==='multi-select';const cur=draft.answers[q.id];
