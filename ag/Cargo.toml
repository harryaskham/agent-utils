[package]
name = "ag"
version = "0.4.1"
edition = "2024"
rust-version = "1.87"
license = "MIT"
description = "Agent speech, images, choices and health across your machines"
repository = "https://github.com/harryaskham/agent-utils"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
configurable-cli = { git = "https://github.com/harryaskham/configurable-cli", rev = "7d2234a2bb81beb7718582a9f927603c07f205f1" }
mcp-cli = { package = "mcp-cli-core", git = "https://github.com/harryaskham/mcp-cli", rev = "81e55235df7d7335d4dc7bd1095131246d157a2a" }
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
nix = { version = "0.30", features = ["poll", "signal", "process", "fs", "term", "hostname"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "process", "time", "sync", "signal", "io-util", "fs", "macros", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }

tempfile = "3"
ahp = "=0.8.0"
ahp-types = "=0.8.0"
ahp-ws = { version = "=0.8.0", default-features = false, features = ["rustls-tls-native-roots"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
serde_yaml = "0.9"
url = "2"

[lints.rust]
unsafe_code = "forbid"

[workspace]
